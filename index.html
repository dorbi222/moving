<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מעבר דירה">
<title>מעבר לבנטל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Karantina:wght@700&family=Secular+One&display=swap">
<style>
/* Layout: mobile = sticky header + content + bottom tab bar; desktop = fixed side nav on the right. Boxes get a "tape label" number like marker on cardboard. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E4E8F0; --line:#D5DBE6;
  --ink:#161B29; --ink-2:#555E73; --ink-3:#8A92A5;
  --accent:#3451C6; --on-accent:#FFFFFF; --accent-soft:#E0E6FA;
  --tape:#EDC25A; --on-tape:#33260A;
  --danger:#C23A2B; --danger-soft:#F7DFDA; --warn:#B7791F;
  --dor:#C05A12; --dor-soft:#FBE6D5; --bar:#A13770; --bar-soft:#F4DCE8;
  --shadow:0 1px 2px rgb(20 28 50 / .06), 0 6px 18px rgb(20 28 50 / .06);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-marker:"Karantina","Secular One",Impact,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1118; --surface:#171B24; --sunk:#20252F; --line:#2B3140;
  --ink:#E6EAF2; --ink-2:#A0A8B8; --ink-3:#6F7789;
  --accent:#8EA2FF; --on-accent:#0B1230; --accent-soft:#222B4D;
  --tape:#D9AA3B; --on-tape:#231700;
  --danger:#F07966; --danger-soft:#3A1F1A; --warn:#E0A84A;
  --dor:#F0A06A; --dor-soft:#3A2414; --bar:#E48CBB; --bar-soft:#3B1E2E;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1118; --surface:#171B24; --sunk:#20252F; --line:#2B3140;
  --ink:#E6EAF2; --ink-2:#A0A8B8; --ink-3:#6F7789;
  --accent:#8EA2FF; --on-accent:#0B1230; --accent-soft:#222B4D;
  --tape:#D9AA3B; --on-tape:#231700;
  --danger:#F07966; --danger-soft:#3A1F1A; --warn:#E0A84A;
  --dor:#F0A06A; --dor-soft:#3A2414; --bar:#E48CBB; --bar-soft:#3B1E2E;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 6px 18px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{display:block;flex:none}
h1,h2,p{margin:0}
.muted{color:var(--ink-2);font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-inner{display:flex;align-items:center;gap:12px;width:100%;max-width:760px;margin:0 auto}
.brand{font-family:var(--f-display);font-size:22px;line-height:1.1;font-weight:400;text-wrap:balance}
.brand-sub{color:var(--ink-2);font-size:13px}
.sync{margin-inline-start:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sync.saving i{background:var(--warn)}
.sync.off i{background:var(--ink-3)}
.main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:4px calc(100px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}

.bottom{position:fixed;inset:auto 0 0 0;z-index:35;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
body.typing .bottom{display:none}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;font-size:12px;font-weight:600;color:var(--ink-2)}
.nav-btn.on{color:var(--accent)}
.nav-btn.on .ic{transform:translateY(-1px)}
.badge{position:absolute;top:6px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sunk);color:var(--ink-2);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.nav-btn.on .badge{background:var(--accent-soft);color:var(--accent)}

@media (min-width:900px){
  .bottom{display:none!important}
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;inset-inline-start:0;width:220px;z-index:36;background:var(--surface);border-inline-end:1px solid var(--line);
    padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-inline:14px;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .side .nav-btn{flex-direction:row;justify-content:flex-start;gap:12px;min-height:44px;padding-inline:12px;border-radius:12px;font-size:15px}
  .side .nav-btn.on{background:var(--accent-soft)}
  .side .badge{position:static;margin-inline-start:auto}
  .side-brand{font-family:var(--f-display);font-size:20px;padding:0 12px 16px}
  .shell{margin-inline-start:220px}
  .main{padding-block-end:40px}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-pad{padding:16px}
.h2{font-family:var(--f-display);font-size:18px;font-weight:400;line-height:1.2}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
.note{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--sunk);color:var(--ink-2)}
.note.warn{background:var(--danger-soft);color:var(--danger)}
.empty{color:var(--ink-3);font-size:14px;padding:6px 16px 10px}

/* hero */
.hero{padding:16px}
.route{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.route .addr{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.route .addr small{font-weight:600;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.route-line{flex:1;display:flex;align-items:center;gap:6px;color:var(--ink-3);min-width:30px}
.route-line::before,.route-line::after{content:"";flex:1;border-top:2px dashed var(--line)}
.route-line .ic{transform:scaleX(-1);color:var(--accent)}
.hero-row{display:flex;align-items:center;gap:16px;margin-top:16px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%}
.ring .track{stroke:var(--sunk)}
.ring .fill{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.ring-num small{font-size:14px}
.countdown{font-family:var(--f-display);font-size:26px;line-height:1.15}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* areas */
.areas{list-style:none;margin:0;padding:4px 8px 10px;display:grid;gap:2px}
.area{display:block;width:100%;padding:10px 8px;border-radius:10px}
.area:hover{background:var(--sunk)}
.area-top{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:600;margin-bottom:6px}
.area-top .num{color:var(--ink-2);font-weight:400;font-size:14px}
.bar{display:block;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s ease}
.bar.thin{height:3px;border-radius:0}
.bar.thin>span{border-radius:0}

/* money */
.money{display:grid;grid-template-columns:repeat(3,1fr)}
.money>div{padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.money>div+div{border-inline-start:1px solid var(--line)}
.money .val{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.money .val.due{color:var(--danger)}

/* filters */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* lists */
.list .card-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.tone-dor .dot,.tone-dor .bar>span{background:var(--dor)}
.tone-bar .dot,.tone-bar .bar>span{background:var(--bar)}
.head-text{display:flex;flex-direction:column;min-width:0;flex:1}
.head-text .muted{font-size:13px}
.count{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--ink-3);transition:transform .2s}
.chev.up{transform:rotate(180deg)}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 10px;min-height:50px;border-top:1px solid var(--line)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center;color:transparent;flex:none;margin-inline:4px 0}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row.done .fld{text-decoration:line-through;color:var(--ink-3)}
.tag{font-size:11px;font-weight:700;color:var(--ink-3);padding-inline-start:9px;margin-bottom:-6px}
.who{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-3)}
.who-dor{background:var(--dor-soft);color:var(--dor)}
.who-bar{background:var(--bar-soft);color:var(--bar)}
.who-both{background:var(--accent-soft);color:var(--accent)}
.done-toggle{display:block;width:100%;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--line)}
.del{width:30px;height:30px;border-radius:50%;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;flex:none;transition:background .15s,color .15s}
.del:hover,.del:focus-visible{background:var(--danger);color:var(--on-accent)}
.del.sm{width:22px;height:22px}

/* fields: 16px everywhere so iOS never zooms on focus */
.fld{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1.5px solid transparent;border-radius:10px;padding:8px 9px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
.fld::placeholder{color:var(--ink-3)}
.fld:hover:not(:disabled){border-color:var(--line)}
.fld:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.fld:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.fld.boxed{background:var(--sunk)}
.fld.boxed:focus{background:var(--surface)}
textarea.fld{resize:vertical;min-height:84px;line-height:1.5}
.ltr{direction:ltr;text-align:right}
.qa{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.qa .fld{background:var(--sunk)}
.qa .fld:focus{background:var(--surface)}
.qa-btn{flex:none;width:42px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.qa-btn:disabled{background:var(--sunk);color:var(--ink-3)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:4px}

/* boxes */
.toolbar{display:flex;gap:10px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding-inline:12px 4px;color:var(--ink-3)}
.search .fld{border:0;padding-inline:4px}
.search .fld:focus{background:transparent}
.btn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 16px;border-radius:12px;min-height:46px}
.btn-ghost{font-size:14px;font-weight:600;color:var(--ink-2);padding:6px 10px;border-radius:8px}
.btn-ghost.danger:hover{background:var(--danger-soft);color:var(--danger)}
.stats{font-size:14px;color:var(--ink-2);padding-inline:4px;font-variant-numeric:tabular-nums}
.boxes{display:grid;gap:10px}
.box-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%}
.box-num{font-family:var(--f-marker);font-size:32px;line-height:1;min-width:48px;height:48px;padding-inline:6px;display:grid;place-items:center;background:var(--tape);color:var(--on-tape);border-radius:4px;transform:rotate(-2.5deg);flex:none;font-variant-numeric:tabular-nums;padding-top:3px}
.box-title{flex:1;min-width:0;display:flex;flex-direction:column}
.box-title strong{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box-title strong.unnamed{color:var(--ink-3);font-weight:600}
.pill{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.st-closed{background:var(--accent-soft);color:var(--accent)}
.st-unpacked{background:var(--dor-soft);color:var(--dor)}
.fragile{color:var(--danger);font-weight:700}
.box-body{border-top:1px solid var(--line);padding:12px 14px 4px;display:flex;flex-direction:column;gap:10px}
.box-body .qa{border-top:0;padding:0}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px 4px 4px 4px;padding-inline-start:12px;font-size:15px;max-width:100%}
.chip span{overflow-wrap:anywhere}
.chip.hit{background:var(--tape);color:var(--on-tape)}
.box-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--danger)}

/* budget */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 16px}
.form-grid .full{grid-column:1/-1}
.form-grid .fld{background:var(--sunk)}
.form-grid .fld:focus{background:var(--surface)}
.with-btn{display:flex;gap:6px}
.icon-btn{text-decoration:none;flex:none;width:42px;border-radius:10px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center}
.balance{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 16px 16px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-weight:600}
.balance .val{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.buy-form{display:flex;gap:8px;padding:4px 12px 12px}
.buy-form .fld{background:var(--sunk)}
.buy-form .fld:focus{background:var(--surface)}
.cost-wrap{flex:none;width:104px;display:flex;align-items:center;position:relative}
.cost-wrap .cur{position:absolute;inset-inline-end:9px;color:var(--ink-3);font-size:14px;pointer-events:none}
.cost-wrap .fld{padding-inline-end:24px;font-variant-numeric:tabular-nums}

/* meters */
.meters{padding:0 12px 14px;display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:56px 1fr 1fr;gap:8px;align-items:center}
.mhead{font-size:12px;font-weight:700;color:var(--ink-2)}
.mlabel{font-weight:600;font-size:15px}
.meters .fld{background:var(--sunk);font-variant-numeric:tabular-nums}
.meters .fld:focus{background:var(--surface)}

/* schedule */
.fld[type=date],.fld[type=time],.fld[type=datetime-local]{min-height:42px}
.sched-head{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:12px;font-weight:600;text-align:center}
.day b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.day.all b{font-family:var(--f-body);font-weight:700;font-size:15px;line-height:1.6}
.day.move{box-shadow:inset 0 0 0 2px var(--tape);border-color:var(--tape)}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.on b{color:var(--on-accent)}
.pips{display:flex;gap:3px;height:5px;justify-content:center}
.pips i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.on .pips i{background:var(--on-accent)}
.dhead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex-wrap:wrap}
.dhead .h2{margin-inline-end:auto}
.move-tag{background:var(--tape);color:var(--on-tape)}
.ev{display:flex;align-items:flex-start;gap:8px;border-top:1px solid var(--line);padding-inline-end:12px}
.ev-body{flex:1;min-width:0;display:flex;gap:12px;align-items:flex-start;padding:12px 6px 12px 14px;padding-inline-start:16px}
.ev-body:disabled{cursor:default}
.ev-time{flex:none;width:50px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.3;text-align:start}
.ev-time small{display:block;color:var(--ink-3);font-weight:600;font-size:13px}
.ev-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-title{font-weight:700;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.ev-meta{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.conflict{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--danger)}
.ev-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:12px}
.ev-side .acts{display:flex;gap:6px}
.ev.past .ev-body{opacity:.55}
.ev.virtual{background:var(--sunk)}
.sync-chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.sync-ok{background:var(--accent-soft);color:var(--accent)}
.sync-wait{background:var(--sunk);color:var(--ink-2)}
.sync-err{background:var(--danger-soft);color:var(--danger)}
.mini-link{font-size:13px;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.icon-btn.sm{width:34px;height:34px;border-radius:50%}
.ev-form .form-grid{padding-top:8px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preset{font-size:14px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.preset.on{background:var(--accent-soft);color:var(--accent)}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.time-row>div:first-child{grid-column:1/-1}
.time-row>div{min-width:0}

/* ---------- icons ---------- */
const ICONS = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  x: '<path d="M18 6 6 18M6 6l12 12"/>',

  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  cal: '<rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  alert: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/>',
  truck: '<path d="M2 6.5h12v9H2zM14 9.5h4l3 3v3h-7"/><circle cx="6" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
};
function Icon({ n, s = 20 }) {
  return html`<svg className="ic" width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[n] }}></svg>`;
}

/* ---------- helpers ---------- */
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '').replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; };
const ILS = new Intl.NumberFormat('he-IL', { style: 'currency', currency: 'ILS', maximumFractionDigits: 0 });
const money = v => ILS.format(num(v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const sumBy = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const clone = x => JSON.parse(JSON.stringify(x ?? null));
function lsGet(k, d) { try { const v = localStorage.getItem('mv:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem('mv:' + k, JSON.stringify(v)); } catch (e) {} }
function usePersist(k, d) { const [v, setV] = useState(() => lsGet(k, d)); return [v, x => { setV(x); lsSet(k, x); }]; }

function daysUntil(s) {
  if (!s) return null; const d = new Date(s); if (isNaN(d)) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0); const dd = new Date(d); dd.setHours(0, 0, 0, 0);
  return Math.round((dd - t) / 86400000);
}
function countdownText(n) {
  if (n == null) return 'מתי עוברים?';
  if (n > 1) return `עוד ${n} ימים להובלה`;
  if (n === 1) return 'ההובלה מחר';
  if (n === 0) return 'ההובלה היום';
  return 'ההובלה מאחורינו';
}
function dateText(s) {
  if (!s) return ''; const d = new Date(s); if (isNaN(d)) return '';
  const day = new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
  return String(s).includes('T') ? `${day}, ${new Intl.DateTimeFormat('he-IL', { hour: '2-digit', minute: '2-digit' }).format(d)}` : day;
}

/* ---------- defaults (used only if a section doesn't exist yet in Firestore) ---------- */
const li = text => ({ id: uid(), text, done: false });
const D = {
  address_shared: ['בנק לאומי', 'ביטוח דירה', 'משרד הפנים', 'מים (תאגיד המים)', 'חשמל', 'גז', 'ארנונה', 'דואר ישראל'].map(li),
  address_dor: ['מקום העבודה של דור', 'מנורה (פנסיה, השתלמות, גמל)', 'מור (השתלמות, גמל)', 'ילין לפידות (השתלמות)', 'הפניקס (השתלמות, גמל)', 'אקסלנס טרייד (תיק השקעות)'].map(li),
  address_bar: ['מקום העבודה של בר', 'מיטב (פנסיה)', 'ילין לפידות (השתלמות)', 'מור (גמל)'].map(li),
  logistics: ['הזמנת ארגזים', 'מיון פריטים', 'הכנת "תיק הישרדות"'].map(li),
  prep: ['תיאום ניקיון', 'הדברה', 'קריאת מונים (דירה ישנה)', 'קריאת מונים (דירה חדשה)'].map(li),
  notes: ['לקחת מפתחות מבעל הבית הישן', 'להחזיר פיקדון על הדירה הישנה', 'לעדכן כתובת בוויז/ניווט'].map(li),
  purchases: [{ id: uid(), text: 'מקרר', cost: 0, done: false }, { id: uid(), text: 'ארון כביסה', cost: 0, done: false }],
  movers: { company: '', contact: '', phone: '', cost: 0, paid: 0, date: '', notes: '' },
  meters: { old: {}, new: {} },
};
const SECTION_KEYS = Object.keys(D);

const LISTS = {
  address_shared: { title: 'משותף', sub: 'בנק, ביטוח, רשויות ותשתיות', tone: 'shared', short: 'כתובת · משותף' },
  address_dor: { title: 'הכספים של דור', sub: 'עבודה, פנסיה, השתלמות וגמל', tone: 'dor', short: 'כתובת · דור' },
  address_bar: { title: 'הכספים של בר', sub: 'עבודה, פנסיה, השתלמות וגמל', tone: 'bar', short: 'כתובת · בר' },
  logistics: { title: 'לוגיסטיקה', sub: 'ארגזים, מיון ותיק הישרדות', tone: 'shared', short: 'לוגיסטיקה' },
  prep: { title: 'הכנת הדירה', sub: 'ניקיון, הדברה ומונים', tone: 'shared', short: 'הכנת הדירה' },
  notes: { title: 'לא לשכוח', sub: 'מפתחות, פיקדון ושאר הקטנות', tone: 'shared', short: 'לא לשכוח' },
};
const TASK_KEYS = ['logistics', 'prep', 'notes', 'address_shared', 'address_dor', 'address_bar'];
const WHO_NEXT = { '': 'dor', dor: 'bar', bar: 'both', both: '' };
const WHO_LABEL = { '': 'מי?', dor: 'דור', bar: 'בר', both: 'שנינו' };
const STATUS = { open: 'בהכנה', closed: 'סגור', unpacked: 'נפרק' };
const STATUS_NEXT = { open: 'closed', closed: 'unpacked', unpacked: 'open' };
const TABS = [
  { id: 'home', label: 'סקירה', icon: 'home' },
  { id: 'schedule', label: 'לו״ז', icon: 'cal' },
  { id: 'address', label: 'כתובות', icon: 'pin' },
  { id: 'prep', label: 'הכנות', icon: 'list' },
  { id: 'boxes', label: 'ארגזים', icon: 'box' },
  { id: 'budget', label: 'תקציב', icon: 'wallet' },
];
const validTab = t => (TABS.some(x => x.id === t) ? t : null);

/* ---------- data layer ----------
   Lists are stored as moving/<key> = { v: [...] } (same shape as before, so existing data carries over).
   List changes run in a transaction: each change is re-applied on the latest server copy,
   so Dor and Bar editing the same list at the same time never overwrite each other. */
const api = {
  get: () => undefined, local: () => {},
  hooks: { pending: () => {}, error: () => {}, undo: () => {} },
  track(p) {
    this.hooks.pending(1);
    return p.catch(e => {
      console.error(e);
      this.hooks.error(e && e.code === 'permission-denied' ? 'אין הרשאה לשמור. בדקו את חוקי האבטחה ב־Firebase' : 'לא נשמר. בדקו את החיבור ונסו שוב');
    }).finally(() => this.hooks.pending(-1));
  },
  mutate(key, fn) {
    this.local(key, fn);
    const ref = sectionDoc(key);
    return this.track(db.runTransaction(async tx => {
      const s = await tx.get(ref);
      const cur = s.exists && s.data().v !== undefined ? s.data().v : clone(D[key]);
      tx.set(ref, { v: fn(clone(cur)) });
    }));
  },
  addItem(key, item) { return this.mutate(key, a => [...(a || []), item]); },
  patchItem(key, id, patch) { return this.mutate(key, a => (a || []).map(x => (x.id === id ? { ...x, ...patch } : x))); },
  removeItem(key, id, label) {
    const arr = this.get(key) || []; const idx = arr.findIndex(x => x.id === id); const removed = arr[idx];
    this.mutate(key, a => (a || []).filter(x => x.id !== id));
    if (removed) this.hooks.undo(label || 'נמחק', () => this.mutate(key, a => {
      const b = [...(a || [])]; if (b.some(x => x.id === removed.id)) return b;
      b.splice(Math.min(idx, b.length), 0, removed); return b;
    }));
  },
  setMap(key, patch) { return this.track(sectionDoc(key).set({ v: patch }, { merge: true })); },
  box(id) { return boxesCol().doc(id); },
  boxAdd(data) { const ref = boxesCol().doc(); this.track(ref.set(data)); return ref.id; },
  boxUpdate(id, patch) { return this.track(this.box(id).update(patch)); },
  boxAddItem(id, item) { return this.track(this.box(id).update({ items: firebase.firestore.FieldValue.arrayUnion(item) })); },
  boxRemoveItem(id, item) { return this.track(this.box(id).update({ items: firebase.firestore.FieldValue.arrayRemove(item) })); },
  boxRemove(b, label) {
    const body = { ...b }; delete body.id;
    this.track(this.box(b.id).delete());
    this.hooks.undo(label || 'נמחק', () => this.track(this.box(b.id).set(body)));
  },
};

/* ---------- small components ---------- */
function Field({ value, onCommit, placeholder, multiline, type = 'text', inputMode, dir = 'auto', className = '', id, debounce, commitOnChange, label, required }) {
  const ro = useContext(RO);
  const v0 = value == null ? '' : String(value);
  const [draft, setDraft] = useState(v0);
  const focused = useRef(false), skip = useRef(false), timer = useRef(null), sent = useRef(v0);
  useEffect(() => { if (!focused.current) { setDraft(v0); sent.current = v0; } }, [v0]);
  useEffect(() => () => clearTimeout(timer.current), []);
  const commit = v => {
    clearTimeout(timer.current);
    if (required && !v.trim()) { setDraft(v0); sent.current = v0; return; }
    if (v !== sent.current) { sent.current = v; onCommit(v); }
  };
  const p = {
    id, value: draft, placeholder, dir, inputMode, disabled: ro, 'aria-label': label, className: 'fld ' + className,
    onFocus: () => { focused.current = true; },
    onBlur: () => { focused.current = false; if (skip.current) { skip.current = false; return; } commit(draft); },
    onChange: e => {
      const v = e.target.value; setDraft(v);
      if (commitOnChange) commit(v);
      else if (debounce) { clearTimeout(timer.current); timer.current = setTimeout(() => commit(v), debounce); }
    },
  };
  if (multiline) return html`<textarea ...${p} rows="3"></textarea>`;
  return html`<input ...${p} type=${type} enterKeyHint="done" autoComplete="off"
    onKeyDown=${e => {
      if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); }
      else if (e.key === 'Escape') { skip.current = true; setDraft(sent.current); e.currentTarget.blur(); }
    }} />`;
}

function QuickAdd({ placeholder, onAdd, label }) {
  const ro = useContext(RO);
  const [v, setV] = useState(''); const ref = useRef(null);
  if (ro) return null;
  const submit = e => { e.preventDefault(); const t = v.trim(); if (!t) return; onAdd(t); setV(''); ref.current && ref.current.focus(); };
  return html`<form className="qa" onSubmit=${submit}>
    <input ref=${ref} className="fld" dir="auto" value=${v} onChange=${e => setV(e.target.value)} placeholder=${placeholder} aria-label=${label || placeholder} enterKeyHint="enter" autoComplete="off" />
    <button className="qa-btn" type="submit" aria-label="הוסף" disabled=${!v.trim()}><${Icon} n="plus" s=${20} /></button>
  </form>`;
}

function Del({ onClick, label = 'מחק', small }) {
  const ro = useContext(RO);
  if (ro) return null;
  return html`<button type="button" className=${'del' + (small ? ' sm' : '')} aria-label=${label}
    onClick=${e => { e.stopPropagation(); onClick(); }}><${Icon} n="x" s=${small ? 12 : 14} /></button>`;
}

function Ring({ value }) {
  const r = 34, c = 2 * Math.PI * r;
  return html`<div className="ring" role="img" aria-label=${`${value} אחוז הושלמו`}>
    <svg viewBox="0 0 80 80">
      <circle className="track" cx="40" cy="40" r=${r} fill="none" strokeWidth="8" />
      <circle className="fill" cx="40" cy="40" r=${r} fill="none" strokeWidth="8" strokeLinecap="round"
        strokeDasharray=${c} strokeDashoffset=${c * (1 - value / 100)} transform="rotate(-90 40 40)" />
    </svg>
    <span className="ring-num">${value}<small>%</small></span>
  </div>`;
}

/* ---------- tasks ---------- */
function TaskRow({ t, k, showWho = true, tag }) {
  const ro = useContext(RO);
  return html`<li className=${'row' + (t.done ? ' done' : '')}>
    <button className="chk" role="checkbox" aria-checked=${!!t.done} aria-label="סמן כבוצע" disabled=${ro}
      onClick=${() => api.patchItem(k, t.id, { done: !t.done })}><${Icon} n="check" s=${15} /></button>
    <div className="row-main">
      ${tag && html`<span className="tag">${tag}</span>`}
      <${Field} value=${t.text} label="שם המשימה" required onCommit=${v => api.patchItem(k, t.id, { text: v.trim() })} />
    </div>
    ${showWho && html`<button className=${'who who-' + (t.who || 'none')} disabled=${ro} aria-label="מי אחראי"
      onClick=${() => api.patchItem(k, t.id, { who: WHO_NEXT[t.who || ''] })}>${WHO_LABEL[t.who || '']}</button>`}
    <${Del} label="מחק משימה" onClick=${() => api.removeItem(k, t.id, 'המשימה נמחקה')} />
  </li>`;
}

function TaskList({ k, items }) {
  const meta = LISTS[k];
  const all = items || [];
  const open = all.filter(t => !t.done);
  const done = all.filter(t => t.done);
  const [collapsed, setCollapsed] = usePersist('col:' + k, false);
  const [showDone, setShowDone] = usePersist('done:' + k, false);
  const showWho = !(k === 'address_dor' || k === 'address_bar');
  return html`<section className=${'card list tone-' + meta.tone}>
    <button className="card-head" aria-expanded=${!collapsed} onClick=${() => setCollapsed(!collapsed)}>
      <span className="dot"></span>
      <span className="head-text"><span className="h2">${meta.title}</span><span className="muted">${meta.sub}</span></span>
      <span className="count">${done.length} מתוך ${all.length}</span>
      <span className=${'chev' + (collapsed ? '' : ' up')}><${Icon} n="chev" s=${18} /></span>
    </button>
    <span className="bar thin"><span style=${{ width: pct(done.length, all.length) + '%' }}></span></span>
    ${!collapsed && html`<div>
      ${all.length === 0 && html`<p className="empty" style=${{ paddingTop: 12 }}>אין עדיין משימות כאן. הוסיפו את הראשונה למטה.</p>`}
      ${all.length > 0 && open.length === 0 && html`<p className="empty" style=${{ paddingTop: 12 }}>הכל בוצע ברשימה הזו.</p>`}
      <ul className="rows">${open.map(t => html`<${TaskRow} key=${t.id} t=${t} k=${k} showWho=${showWho} />`)}</ul>
      ${done.length > 0 && html`<button className="done-toggle" onClick=${() => setShowDone(!showDone)}>${showDone ? 'הסתר' : 'הצג'} ${done.length} שבוצעו</button>`}
      ${showDone && done.length > 0 && html`<ul className="rows">${done.map(t => html`<${TaskRow} key=${t.id} t=${t} k=${k} showWho=${showWho} />`)}</ul>`}
      <${QuickAdd} placeholder="משימה חדשה…" label=${'הוספת משימה ל' + meta.title}
        onAdd=${text => api.addItem(k, { id: uid(), text, done: false, who: '' })} />
    </div>`}
  </section>`;
}

/* ---------- home ---------- */
function computeAreas(S, boxes) {
  const t = ks => { const it = ks.flatMap(k => S[k] || []); return [it.filter(x => x.done).length, it.length]; };
  const m = S.movers || {};
  const purchases = S.purchases || [];
  const steps = [!!String(m.company || '').trim(), !!m.date, num(m.cost) > 0, num(m.cost) > 0 && num(m.paid) >= num(m.cost)];
  return [
    { key: 'addr', label: 'שינוי כתובת', tab: 'address', v: t(['address_shared', 'address_dor', 'address_bar']) },
    { key: 'prep', label: 'הכנות ולוגיסטיקה', tab: 'prep', v: t(['logistics', 'prep', 'notes']) },
    { key: 'boxes', label: 'ארגזים סגורים', tab: 'boxes', v: [boxes.filter(b => b.status === 'closed' || b.status === 'unpacked').length, boxes.length] },
    { key: 'buy', label: 'קניות לבית', tab: 'budget', v: [purchases.filter(p => p.done).length, purchases.length] },
    { key: 'movers', label: 'הובלה (חברה, תאריך, מחיר, תשלום)', tab: 'budget', v: [steps.filter(Boolean).length, 4] },
  ];
}

function Home({ S, boxes, events, go }) {
  const movers = S.movers || {};
  const purchases = S.purchases || [];
  const areas = computeAreas(S, boxes);
  const active = areas.filter(a => a.v[1] > 0);
  const overall = active.length ? Math.round((active.reduce((s, a) => s + a.v[0] / a.v[1], 0) / active.length) * 100) : 0;
  const days = daysUntil(movers.date);
  const [who, setWho] = usePersist('who', 'all');

const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDay(new Date());
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return isoDay(d); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fromMin = m => { m = Math.max(0, Math.min(23 * 60 + 59, m)); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const dayLabel = s => new Intl.DateTimeFormat('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }).format(parseDay(s));
const dayNarrow = s => new Intl.DateTimeFormat('he-IL', { weekday: 'narrow' }).format(parseDay(s));
const dayChip = s => `${dayNarrow(s)} ${parseDay(s).getDate()}/${parseDay(s).getMonth() + 1}`;
const isPast = e => { const t = todayIso(); return e.date < t || (e.date === t && toMin(e.end || e.start) < nowMin()); };
const byWhen = (a, b) => (a.date + a.start).localeCompare(b.date + b.start);
const STALE_MS = 3 * 60 * 1000;

  const p = new URLSearchParams({ action: 'TEMPLATE', text: e.title, dates: f(e.date, e.start) + '/' + f(e.date, e.end || e.start),
    ctz: 'Asia/Jerusalem', location: e.location || '', details: evDetails(e), add: INVITEES.join(',') });
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
function conflictsOf(list) {
  const out = new Set(), byDay = {};
  list.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
  Object.values(byDay).forEach(a => {
    for (let i = 0; i < a.length; i++) for (let j = i + 1; j < a.length; j++) {
      const x = a[i], y = a[j];
      if (toMin(x.start) < toMin(y.end || y.start) && toMin(y.start) < toMin(x.end || x.start)) { out.add(x.id); out.add(y.id); }
    }
  });
  return out;
}

}

const evApi = {
  save(id, data) {
    const body = { ...data, needsSync: true, syncState: 'pending', syncError: '', deleted: false, rev: Date.now(), updatedAt: Date.now() };
    if (!id) { const ref = eventsCol().doc(); api.track(ref.set({ ...body, createdAt: Date.now() })); return ref.id; }
    api.track(eventsCol().doc(id).update(body)); return id;
  },
  remove(e) {
    const body = { ...e }; delete body.id;
    api.track(eventsCol().doc(e.id).update({ deleted: true, needsSync: true, updatedAt: Date.now() }));
    api.hooks.undo('הפגישה נמחקה', () => api.track(eventsCol().doc(e.id).set({ ...body, deleted: false, needsSync: true, syncState: 'pending', rev: Date.now(), updatedAt: Date.now() })));
  },
  retry(e) { api.track(eventsCol().doc(e.id).update({ needsSync: true, syncState: 'pending', syncError: '', rev: Date.now(), updatedAt: Date.now() })); },
};

function EventForm({ initial, defDay, week, onClose }) {
  const ro = useContext(RO);
  const [f, setF] = useState(() => initial
    ? { title: initial.title || '', date: initial.date || defDay, start: initial.start || '09:00', end: initial.end || '', contact: initial.contact || '', phone: initial.phone || '', place: initial.place || 'new', location: initial.location ?? PLACE_ADDR.new, who: initial.who || '', notes: initial.notes || '' }
    : { title: '', date: defDay, start: '09:00', end: '11:00', contact: '', phone: '', place: 'new', location: PLACE_ADDR.new, who: '', notes: '' });
  const set = patch => setF(x => ({ ...x, ...patch }));
  const dur = Math.max(15, toMin(f.end) - toMin(f.start));
  const setStart = v => set({ start: v, end: v ? fromMin(toMin(v) + dur) : f.end });
  const pickPreset = p => set({ title: p.t, end: fromMin(toMin(f.start) + p.d), place: p.place, location: PLACE_ADDR[p.place] });
  const setPlace = k => set({ place: k, location: PLACE_ADDR[k] });
  const valid = !!(f.title.trim() && f.date && f.start);
  useEffect(() => { window.scrollTo({ top: 0 }); }, []);
  const submit = e => {
    e.preventDefault(); if (!valid || ro) return;
    const end = f.end && toMin(f.end) > toMin(f.start) ? f.end : fromMin(toMin(f.start) + 60);
    evApi.save(initial && initial.id, { ...f, end, title: f.title.trim(), contact: f.contact.trim(), phone: f.phone.trim(), location: String(f.location || '').trim(), notes: f.notes.trim() });
    onClose(initial ? 'הפגישה עודכנה. היומן יתעדכן תוך דקה' : 'נוסף ללו״ז. הזימון יגיע לשניכם תוך דקה');
  };
  return html`<form className="card ev-form" onSubmit=${submit}>
    <div className="sec-title"><h2 className="h2">${initial ? 'עריכת פגישה' : 'פגישה חדשה'}</h2><button type="button" className="btn-ghost" onClick=${() => onClose()}>ביטול</button></div>
    <div className="form-grid">
      <div className="full">
        <label className="lbl" htmlFor="ev-title">מה מתוכנן?</label>
        <input id="ev-title" className="fld" dir="auto" value=${f.title} onChange=${e => set({ title: e.target.value })} onKeyDown=${noEnter} placeholder="למשל: התקנת תמי 4" autoComplete="off" enterKeyHint="next" />
        ${!initial && html`<div className="presets">${PRESETS.map(p => html`<button type="button" key=${p.t} className=${'preset' + (f.title === p.t ? ' on' : '')} onClick=${() => pickPreset(p)}>${p.t}</button>`)}</div>`}
      </div>
      <div className="full">
        <div className="time-row">
          <div><label className="lbl" htmlFor="ev-date">תאריך</label><input id="ev-date" type="date" className="fld ltr" dir="ltr" value=${f.date} onChange=${e => set({ date: e.target.value })} required /></div>
          <div><label className="lbl" htmlFor="ev-start">משעה</label><input id="ev-start" type="time" step="900" className="fld ltr" dir="ltr" value=${f.start} onChange=${e => setStart(e.target.value)} required /></div>
          <div><label className="lbl" htmlFor="ev-end">עד</label><input id="ev-end" type="time" step="900" className="fld ltr" dir="ltr" value=${f.end} onChange=${e => set({ end: e.target.value })} /></div>
        </div>
        <div className="quick-days" role="group" aria-label="בחירה מהירה של יום">${week.map(d => html`<button type="button" key=${d} className=${'preset' + (f.date === d ? ' on' : '')} onClick=${() => set({ date: d })}>${dayChip(d)}</button>`)}</div>
      </div>
      <div><label className="lbl" htmlFor="ev-contact">ספק / איש קשר</label><input id="ev-contact" className="fld" dir="auto" value=${f.contact} onChange=${e => set({ contact: e.target.value })} onKeyDown=${noEnter} placeholder="שם הטכנאי או החברה" autoComplete="off" /></div>
      <div><label className="lbl" htmlFor="ev-phone">טלפון</label><input id="ev-phone" type="tel" inputMode="tel" className="fld ltr" dir="ltr" value=${f.phone} onChange=${e => set({ phone: e.target.value })} onKeyDown=${noEnter} placeholder="050-0000000" autoComplete="off" /></div>
      <div className="full">
        <span className="lbl">איפה</span>
        <div className="seg wide" role="group" aria-label="מיקום">${PLACES.map(([k, l]) => html`<button type="button" key=${k} className=${f.place === k ? 'on' : ''} aria-pressed=${f.place === k} onClick=${() => setPlace(k)}>${l}</button>`)}</div>
        ${f.place === 'other' && html`<input id="ev-loc" className="fld" style=${{ marginTop: 8 }} dir="auto" value=${f.location} onChange=${e => set({ location: e.target.value })} onKeyDown=${noEnter} placeholder="כתובת" autoComplete="off" />`}
      </div>
      <div className="full">
        <span className="lbl">מי פוגש אותו?</span>
        <div className="seg wide" role="group" aria-label="מי פוגש">${[['dor', 'דור'], ['bar', 'בר'], ['both', 'שנינו'], ['', 'לא סגור']].map(([k, l]) => html`<button type="button" key=${k || 'none'} className=${f.who === k ? 'on' : ''} aria-pressed=${f.who === k} onClick=${() => set({ who: k })}>${l}</button>`)}</div>
      </div>
      <div className="full"><label className="lbl" htmlFor="ev-notes">הערות</label><textarea id="ev-notes" className="fld" rows="2" dir="auto" value=${f.notes} onChange=${e => set({ notes: e.target.value })} placeholder="קוד לבניין, מה להכין, מה לבקש מהטכנאי…"></textarea></div>
    </div>
    <p className="invite-note">הזימון יישלח ל־<bdi dir="ltr">${INVITEES[0]}</bdi> ול־<bdi dir="ltr">${INVITEES[1]}</bdi></p>
    <div className="form-actions">
      ${initial && !ro ? html`<button type="button" className="btn-ghost danger" onClick=${() => { evApi.remove(initial); onClose(); }}>מחק פגישה</button>` : null}
      <div className="grow">
        ${initial && valid ? html`<a className="mini-link" href=${gcalLink({ ...f, end: f.end || f.start })} target="_blank" rel="noopener">הוספה ידנית ליומן</a>` : null}
        <button className="btn" type="submit" disabled=${!valid || ro}>${initial ? 'שמירה' : 'הוספה ושליחת זימון'}</button>
      </div>
    </div>
  </form>`;
}

function EventRow({ e, conflict, onEdit, go }) {
  const ro = useContext(RO);
  const past = isPast(e);
  const stale = !e.virtual && e.syncState !== 'synced' && Date.now() - (e.updatedAt || 0) > STALE_MS;
  const chip = e.virtual ? null : e.syncState === 'synced' ? ['ok', 'ביומן של שניכם'] : e.syncState === 'error' ? ['err', 'השליחה נכשלה'] : ['wait', 'ממתין ליומן'];
  const place = e.place === 'old' ? 'הדרים' : e.place === 'other' ? (e.location || '') : e.virtual ? '' : 'בנטל';
  const tel = String(e.phone || '').replace(/[^\d+]/g, '');
  return html`<li className=${'ev' + (past ? ' past' : '') + (e.virtual ? ' virtual' : '')}>
    <button className="ev-body" disabled=${ro && !e.virtual} onClick=${() => (e.virtual ? go('budget') : onEdit(e))} aria-label=${'עריכת ' + e.title}>
      <span className="ev-time"><bdi>${e.start}</bdi>${e.virtual ? html`<small>התחלה</small>` : html`<small><bdi>${e.end}</bdi></small>`}</span>
      <span className="ev-main">
        <span className="ev-title" dir="auto">${e.title}</span>
        <span className="ev-meta">
          ${e.contact && html`<span dir="auto">${e.contact}</span>`}
          ${place && html`<span>${place}</span>`}
          ${e.who && html`<span>פוגש: ${WHO_LABEL[e.who]}</span>`}
        </span>
        ${conflict && html`<span className="conflict"><${Icon} n="alert" s=${14} />חופף לפגישה אחרת</span>`}
        ${e.syncState === 'error' && e.syncError && html`<span className="muted" dir="auto">${e.syncError}</span>`}
      </span>
    </button>
    <div className="ev-side">
      ${chip && html`<span className=${'sync-chip sync-' + chip[0]}>${chip[1]}</span>`}
      <div className="acts">
        ${tel && html`<a className="icon-btn sm" href=${'tel:' + tel} aria-label=${'חיוג ל' + (e.contact || 'ספק')}><${Icon} n="phone" s=${16} /></a>`}
      </div>
      ${!e.virtual && e.syncState === 'error' && !ro && html`<button className="mini-link" onClick=${() => evApi.retry(e)}>נסו שוב</button>`}
      ${!e.virtual && (stale || e.syncState === 'error') && html`<a className="mini-link" href=${gcalLink(e)} target="_blank" rel="noopener">הוספה ידנית</a>`}
    </div>
  </li>`;
}

function Schedule({ events, movers, go, toast }) {
  const ro = useContext(RO);
  const [sel, setSel] = useState(null);
  const [editing, setEditing] = useState(null);
  const [showPast, setShowPast] = useState(false);
  const today = todayIso();
  const moveDay = (movers && movers.date) ? String(movers.date).slice(0, 10) : null;
  const anchor = moveDay || today;
  const week = Array.from({ length: 7 }, (_, i) => addDays(anchor, i - 3));
  const mv = moveEvent(movers);
  const all = [...events.filter(e => !e.deleted && e.date), ...(mv ? [mv] : [])].sort(byWhen);
  const conflicts = conflictsOf(all);
  const past = all.filter(isPast), upcoming = all.filter(e => !isPast(e));
  const shown = sel ? all.filter(e => e.date === sel) : (showPast ? all : upcoming);
  const groups = [];
  shown.forEach(e => { const g = groups[groups.length - 1]; if (g && g[0] === e.date) g[1].push(e); else groups.push([e.date, [e]]); });
  const real = events.filter(e => !e.deleted);
  const notConnected = !real.some(e => e.syncState === 'synced') && real.some(e => e.syncState !== 'synced' && Date.now() - (e.updatedAt || 0) > STALE_MS);
  const defDay = sel || (week.includes(today) ? today : anchor);
  const close = msg => { setEditing(null); if (msg) toast({ msg }); };

  if (editing) return html`<${EventForm} initial=${editing === 'new' ? null : editing} defDay=${defDay} week=${week} onClose=${close} />`;

  return html`<div className="stack">
    <div className="toolbar">
      <div className="sched-head">
        <p className="h2">שבוע המעבר</p>
        <p className="muted">${moveDay ? 'ההובלה ב' + dayLabel(moveDay) : html`<button className="link" onClick=${() => go('budget')}>קבעו תאריך הובלה</button> כדי למרכז את השבוע סביבו`}</p>
      </div>
      ${!ro && html`<button className="btn" onClick=${() => setEditing('new')}><${Icon} n="plus" s=${18} />פגישה</button>`}
    </div>

    <div className="days" role="group" aria-label="ימי שבוע המעבר">
      <button className=${'day all' + (sel ? '' : ' on')} aria-pressed=${!sel} onClick=${() => setSel(null)}><span>לו״ז</span><b>הכל</b><span className="pips"></span></button>
      ${week.map(d => {
        const n = all.filter(e => e.date === d).length;
        return html`<button key=${d} className=${'day' + (sel === d ? ' on' : '') + (d === moveDay ? ' move' : '')} aria-pressed=${sel === d}
          aria-label=${dayLabel(d) + (n ? `, ${n} פגישות` : '')} onClick=${() => setSel(sel === d ? null : d)}>
          <span>${d === today ? 'היום' : dayNarrow(d)}</span><b>${parseDay(d).getDate()}</b>
          <span className="pips">${Array.from({ length: Math.min(n, 3) }, (_, i) => html`<i key=${i}></i>`)}</span>
        </button>`;
      })}
    </div>

    ${notConnected && html`<p className="note">הזימונים עוד לא יוצאים אוטומטית, כי החיבור ליומן עוד לא הוגדר. בינתיים אפשר ללחוץ על ״הוספה ידנית״ ליד כל פגישה.</p>`}

    ${groups.length === 0 ? html`<div className="card card-pad">
        <p className="h2">${sel ? 'אין כלום ב' + dayLabel(sel) : 'הלו״ז ריק'}</p>
        <p className="muted">תיאמתם טכנאי או ספק? רשמו אותו כאן, וזימון יישלח ליומן של שניכם.</p>
        ${!ro && html`<button className="btn" style=${{ marginTop: 12 }} onClick=${() => setEditing('new')}><${Icon} n="plus" s=${18} />הוספת פגישה</button>`}
      </div>`
      : groups.map(([d, evs]) => html`<section className="card" key=${d}>
        <div className="dhead">
          <h2 className="h2">${dayLabel(d)}</h2>
          ${d === moveDay && html`<span className="pill move-tag">יום ההובלה</span>`}
          ${d === today && html`<span className="pill">היום</span>`}
        </div>
        <ul className="rows">${evs.map(e => html`<${EventRow} key=${e.id} e=${e} conflict=${conflicts.has(e.id)} onEdit=${setEditing} go=${go} />`)}</ul>
      </section>`)}

    ${!sel && past.length > 0 && html`<button className="done-toggle past-toggle" onClick=${() => setShowPast(!showPast)}>${showPast ? 'הסתר' : 'הצג'} ${past.length} שכבר עברו</button>`}
  </div>`;
}

function UpNext({ events, go }) {
  const up = events.filter(e => !e.deleted && e.date && !isPast(e)).sort(byWhen).slice(0, 3);
  return html`<section className="card">
    <div className="sec-title"><h2 className="h2">בלו״ז הקרוב</h2><button className="mini-link" onClick=${() => go('schedule')}>לכל הלו״ז</button></div>
    ${up.length === 0 ? html`<p className="empty">אין עדיין פגישות עם ספקים. <button className="link" onClick=${() => go('schedule')}>הוסיפו את הראשונה</button></p>`
      : html`<ul className="rows">${up.map(e => html`<li key=${e.id} className="ev">
          <button className="ev-body" onClick=${() => go('schedule')}>
            <span className="ev-time"><bdi>${e.start}</bdi><small><bdi>${e.end}</bdi></small></span>
            <span className="ev-main"><span className="ev-title" dir="auto">${e.title}</span><span className="ev-meta"><span>${e.date === todayIso() ? 'היום' : dayLabel(e.date)}</span>${e.contact && html`<span dir="auto">${e.contact}</span>`}</span></span>
          </button>
        </li>`)}</ul>`}
  </section>`;
}

/* ---------- app ---------- */
function App() {
  const [tab, setTab] = useState(() => validTab(location.hash.slice(1)) || 'home');
  const [S, setS] = useState({});
  const [boxes, setBoxes] = useState([]);
  const [events, setEvents] = useState([]);
  const [got, setGot] = useState({});
  const [conn, setConn] = useState(db ? 'connecting' : 'off');
  const [pending, setPending] = useState(0);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const sRef = useRef(S); sRef.current = S;

  const showToast = t => { clearTimeout(toastTimer.current); setToast({ ...t, k: Date.now() }); toastTimer.current = setTimeout(() => setToast(null), t.undo ? 6000 : 4000); };

  useEffect(() => {
    api.get = key => sRef.current[key];
    api.local = (key, fn) => setS(s => ({ ...s, [key]: fn(clone(s[key] ?? D[key])) }));
    api.hooks.pending = d => setPending(p => Math.max(0, p + d));
    api.hooks.error = msg => showToast({ msg, kind: 'err' });
    api.hooks.undo = (msg, fn) => showToast({ msg, undo: fn });
  }, []);

  useEffect(() => {
    if (!db) return;
    const unsubs = [];
    const mark = k => setGot(g => (g[k] ? g : { ...g, [k]: true }));
    SECTION_KEYS.forEach(key => {
      unsubs.push(sectionDoc(key).onSnapshot(snap => {
        setConn('live');
        if (!snap.exists) { sectionDoc(key).set({ v: D[key] }).catch(() => {}); setS(s => ({ ...s, [key]: D[key] })); }
        else setS(s => ({ ...s, [key]: snap.data().v }));
        mark(key);
      }, err => { console.error(err); setConn('off'); mark(key); }));
    });
    unsubs.push(boxesCol().onSnapshot(snap => {
      setBoxes(snap.docs.map(d => ({ ...d.data(), id: d.id })));
      mark('boxes');
    }, err => { console.error(err); setConn('off'); mark('boxes'); }));
    unsubs.push(eventsCol().onSnapshot(snap => {
      setEvents(snap.docs.map(d => ({ ...d.data(), id: d.id })));
      mark('events');
    }, err => { console.error(err); mark('events'); }));
    const fallback = setTimeout(() => setGot(g => ({ ...g, all: true })), 5000);
    return () => { unsubs.forEach(f => f()); clearTimeout(fallback); };
  }, []);

  useEffect(() => {
    const on = () => { const t = validTab(location.hash.slice(1)); if (t) setTab(t); };
    window.addEventListener('hashchange', on); return () => window.removeEventListener('hashchange', on);
  }, []);

  // hide the bottom bar while typing so the keyboard never pushes it over the field
  useEffect(() => {
    const isField = el => el && ((el.tagName === 'INPUT' && !['checkbox', 'button', 'submit'].includes(el.type)) || el.tagName === 'TEXTAREA');
    const fin = e => { if (isField(e.target)) document.body.classList.add('typing'); };
    const fout = () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('typing'); }, 80);
    document.addEventListener('focusin', fin); document.addEventListener('focusout', fout);
    return () => { document.removeEventListener('focusin', fin); document.removeEventListener('focusout', fout); };
  }, []);

  const go = t => { setTab(t); try { if (location.hash !== '#' + t) location.hash = t; } catch (e) {} window.scrollTo({ top: 0 }); };

  const ready = conn === 'off' || got.all || (SECTION_KEYS.every(k => got[k]) && got.boxes && got.events);
  const openCount = ks => ks.reduce((n, k) => n + (S[k] || []).filter(t => !t.done).length, 0);
  const badges = {
    schedule: events.filter(e => !e.deleted && e.date && !isPast(e)).length,
    address: openCount(['address_shared', 'address_dor', 'address_bar']),
    prep: openCount(['logistics', 'prep', 'notes']),
    boxes: boxes.filter(b => (b.status || 'open') === 'open').length,
    budget: openCount(['purchases']),
  };
  const navBtns = TABS.map(t => html`<button key=${t.id} className=${'nav-btn' + (tab === t.id ? ' on' : '')} aria-current=${tab === t.id ? 'page' : null} onClick=${() => go(t.id)}>
    <${Icon} n=${t.icon} s=${22} /><span>${t.label}</span>${badges[t.id] ? html`<span className="badge">${badges[t.id]}</span>` : null}</button>`);

  const syncCls = conn === 'off' ? 'off' : pending > 0 ? 'saving' : '';
  const syncTxt = conn === 'off' ? 'אין חיבור' : conn === 'connecting' ? 'מתחבר…' : pending > 0 ? 'שומר…' : 'מסונכרן';
  const title = tab === 'home' ? 'מעבר לבנטל' : TABS.find(t => t.id === tab).label;

  let view;
  if (!ready) view = html`<div className="stack"><div className="card skel" style=${{ height: 170 }}></div><div className="card skel" style=${{ height: 240 }}></div><div className="card skel" style=${{ height: 120 }}></div></div>`;
  else if (tab === 'home') view = html`<${Home} S=${S} boxes=${boxes} events=${events} go=${go} />`;
  else if (tab === 'schedule') view = html`<${Schedule} events=${events} movers=${S.movers} go=${go} toast=${showToast} />`;
  else if (tab === 'address') view = html`<div className="stack">${['address_shared', 'address_dor', 'address_bar'].map(k => html`<${TaskList} key=${k} k=${k} items=${S[k]} />`)}</div>`;
  else if (tab === 'prep') view = html`<div className="stack"><${TaskList} k="logistics" items=${S.logistics} /><${TaskList} k="prep" items=${S.prep} /><${Meters} meters=${S.meters} /><${TaskList} k="notes" items=${S.notes} /></div>`;
  else if (tab === 'boxes') view = html`<${Boxes} boxes=${boxes} />`;
  else view = html`<div className="stack"><${Movers} movers=${S.movers} /><${Purchases} purchases=${S.purchases} /></div>`;

  return html`<${RO.Provider} value=${!db}>
    <nav className="side" aria-label="ניווט"><div className="side-brand">מעבר לבנטל</div>${navBtns}</nav>
    <div className="shell">
      <header className="top"><div className="top-inner">
        <div><h1 className="brand">${title}</h1><div className="brand-sub">דור ובר · כפר יונה</div></div>
        <span className=${'sync ' + syncCls} role="status"><i></i>${syncTxt}</span>
      </div></header>
      <main className="main">
        ${conn === 'off' && html`<p className="note warn">אין חיבור למאגר המשותף. בדקו אינטרנט, ואם זה נמשך, את חוקי האבטחה של Firestore.</p>`}
        ${view}
      </main>
    </div>
    <nav className="bottom" aria-label="ניווט">${navBtns}</nav>
    ${toast && html`<div key=${toast.k} className=${'toast' + (toast.kind === 'err' ? ' err' : '')} role="status">
      <span>${toast.msg}</span>
      ${toast.undo && html`<button className="toast-btn" onClick=${() => { toast.undo(); setToast(null); }}>ביטול</button>`}
    </div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

</script>
</body>
</html>
